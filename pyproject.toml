[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "florence2-svoa"
version = "0.1.0"
description = "Structured visual event extraction with a fine-tuned Florence-2 model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ilya Zelenskiy"}]
keywords = ["florence-2", "vision-language-model", "visual-events", "svoa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
download = ["remotezip>=0.12"]
prepare = ["openai>=1.40", "lemminflect>=0.2.3"]
inference = [
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.45",
  "accelerate>=0.34",
  "timm>=1.0",
  "einops>=0.8",
  "safetensors>=0.4",
]
video = ["opencv-python-headless>=4.10"]
dev = ["coverage>=7.6"]
all = [
  "remotezip>=0.12",
  "openai>=1.40",
  "lemminflect>=0.2.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.45",
  "accelerate>=0.34",
  "timm>=1.0",
  "einops>=0.8",
  "safetensors>=0.4",
  "opencv-python-headless>=4.10",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/iproxy3d/florence2-svoa"
Repository = "https://github.com/iproxy3d/florence2-svoa"
Issues = "https://github.com/iproxy3d/florence2-svoa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["florence2_svoa"]

[tool.coverage.report]
show_missing = true
fail_under = 70
